[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usdot-gradecrossing-monitoring"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",
    "ultralytics",
    "lap>=0.5.12",
    "pyyaml",
    "gdown>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
