[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "usdot-gradecrossing-monitoring"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",
    "ultralytics",
    "lap>=0.5.12",
    "pyyaml",
    "gdown",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
