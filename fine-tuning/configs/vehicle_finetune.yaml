# vehicle_finetune.yaml
# YOLOv11n fine-tuning config for vehicle detection at railroad grade crossings
#
# Setup:
#   1. Download the vehicle dataset zip from GitHub Releases
#   2. Extract contents into data/ at the repo root
#   3. Run from the repo root:
#        yolo train cfg=fine-tuning/configs/vehicle_finetune.yaml
#      Or from Python:
#        from ultralytics import YOLO
#        YOLO('yolo11n.pt').train(cfg='fine-tuning/configs/vehicle_finetune.yaml')

# Base model — downloads automatically from Ultralytics if not present
model: models/yolo11n.pt

# Dataset config — provided in the release zip, placed in data/
data: data/data.yaml

# Training hyperparameters
epochs: 50
batch: 16          # reduce to 8 or 4 if you get out-of-memory errors on CPU
imgsz: 640
lr0: 0.01          # initial learning rate
lrf: 0.01          # final learning rate (fraction of lr0)
patience: 10       # early stopping patience (epochs without improvement)

# Hardware — auto-detects the best available device for whoever is running this:
#   NVIDIA GPU (CUDA)  → fastest, typical on Linux/Windows servers
#   Apple Silicon MPS  → fast, Mac M-series chips
#   CPU only           → slowest but works on any machine
# Override manually if needed: device: 0 (CUDA), device: mps, device: cpu
device: ''

# Output — saved directly to models/{name}/ (gitignored via models/*)
# Run 001: runs/detect/models/vehicle_finetune_v1/weights/  ← legacy path (still valid)
# Run 002+: models/vehicle_finetune_v2/weights/             ← clean path going forward
project: models
name: vehicle_finetune_v2
save: true
save_period: -1    # only save best and last checkpoints

# Target classes (defined in data/data.yaml — CCTV_Vehicles v7, Roboflow)
# In scope:     Car, Jeep, Motorcycle, Tricycle, Truck, Van
# Out of scope: pedestrian (not in this dataset), signs, gate arms, infrastructure
