# vehicle_finetune.yaml
# YOLOv11n fine-tuning config for vehicle detection at railroad grade crossings
#
# Setup:
#   1. Download the vehicle dataset zip from GitHub Releases
#   2. Extract contents into data/ at the repo root
#   3. Run from the repo root:
#        yolo train cfg=fine-tuning/configs/vehicle_finetune.yaml
#      Or from Python:
#        from ultralytics import YOLO
#        YOLO('yolo11n.pt').train(cfg='fine-tuning/configs/vehicle_finetune.yaml')

# Base model — downloads automatically from Ultralytics if not present
model: yolo11n.pt

# Dataset config — provided in the release zip, placed in data/
data: data/data.yaml

# Training hyperparameters
epochs: 50
batch: 16
imgsz: 640
lr0: 0.01          # initial learning rate
lrf: 0.01          # final learning rate (fraction of lr0)
patience: 10       # early stopping patience (epochs without improvement)

# Hardware
device: 0          # GPU index; use 'cpu' if no GPU available

# Output — saved to models/ (gitignored)
project: models
name: vehicle_finetune_v1
save: true
save_period: -1    # only save best and last checkpoints

# Target classes (defined in data/data.yaml)
# In scope:     car, truck, pedestrian
# Out of scope: signs, gate arms, infrastructure
